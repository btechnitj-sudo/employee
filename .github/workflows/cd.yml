name: Employee App CD

on:
  workflow_run:
    workflows: ["Employee App CI"]
    types:
      - completed
    branches:
      - main

# Required for GitHub OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:

  deploy:

    # Run CD only when CI succeeds
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout source code
      # ==========================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main


      # ==========================================
      # 2. Setup Java 21
      # ==========================================
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven


      # ==========================================
      # 3. Build JAR
      # ==========================================
      # Dockerfile uses target/*.jar
      - name: Build application
        run: ./mvnw package -DskipTests


      # ==========================================
      # 4. Authenticate GitHub with AWS using OIDC
      # ==========================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::062538339114:role/GitHubActionsEmployeeRole
          aws-region: ap-south-1


      # ==========================================
      # 5. Verify AWS identity
      # ==========================================
      - name: Verify AWS identity
        run: aws sts get-caller-identity


      # ==========================================
      # 6. Login to Amazon ECR
      # ==========================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ==========================================
      # 7. Build Docker image
      # ==========================================
      - name: Build Docker image
        run: |
          docker build -t employee-app .


      # ==========================================
      # 8. Tag Docker image
      # ==========================================
      - name: Tag Docker image
        run: |
          docker tag employee-app:latest \
            ${{ steps.login-ecr.outputs.registry }}/employee-app:latest


      # ==========================================
      # 9. Push Docker image to ECR
      # ==========================================
      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/employee-app:latest


      # ==========================================
      # 10. Deploy to EC2
      # ==========================================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            echo "Logging into Amazon ECR..."

            aws ecr get-login-password --region ap-south-1 | \
              sudo docker login \
              --username AWS \
              --password-stdin \
              062538339114.dkr.ecr.ap-south-1.amazonaws.com


            echo "Pulling latest Docker image..."

            sudo docker pull \
              062538339114.dkr.ecr.ap-south-1.amazonaws.com/employee-app:latest


            echo "Stopping old container..."

            sudo docker stop employee-app || true


            echo "Removing old container..."

            sudo docker rm employee-app || true


            echo "Starting new container..."

            sudo docker run -d \
              --name employee-app \
              --restart unless-stopped \
              --env-file /home/ubuntu/employee.env \
              -p 8080:8080 \
              062538339114.dkr.ecr.ap-south-1.amazonaws.com/employee-app:latest


            echo "Deployment completed!"


            echo "Running containers:"

            sudo docker ps
name: Employee App CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Required for GitHub OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw clean test

      - name: Package application
        run: ./mvnw package -DskipTests

      # Authenticate GitHub Actions with AWS IAM Role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::062538339114:role/GitHubActionsEmployeeRole
          aws-region: ap-south-1

      # Verify that GitHub Actions successfully assumed the role
      - name: Verify AWS identity
        run: aws sts get-caller-identity